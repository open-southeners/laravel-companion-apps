name: Publish

on:
  push:
    tags:
      - "**"

jobs:
  # @see https://stackoverflow.com/a/72959712/8179249
  check-current-branch:
    runs-on: ubuntu-latest

    outputs:
      branch: ${{ steps.check_step.outputs.branch }}

    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🏗 Get current branch
        id: check_step
        run: |
          raw=$(git branch -r --contains ${{ github.ref }})
          branch="$(echo ${raw//origin\//} | tr -d '\n')"
          echo "{name}=branch" >> $GITHUB_OUTPUT
          echo "Branches where this tag exists : $branch."

  build:
    runs-on: ubuntu-latest

    needs: check-current-branch

    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v5

      - name: 🏗 Get release info
        id: query-release-info
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: latest

      - name: 🚀 Publish to Github releases
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.query-release-info.outputs.release-notes }}
          make_latest: contains(${{ needs.check.outputs.branch }}, 'main')
          # prerelease: true
          # files: '*.vsix'

  announce:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    uses: Pepebits/release-announce/.github/workflows/announce.yml@v1
    with:
      tag: ${{ github.ref_name }}
      notes_source: changelog
      banner_url: https://opensoutheners.com/gh_card/{repo}
      install_title: 📦 Composer
      install_command: composer require open-southeners/laravel-companion-apps:^{minor}
      buttons: >-
        [{"text": "📝 Notes", "url": "{repo_url}/releases/tag/{tag}"},
         {"text": "📦 Packagist", "url": "https://packagist.org/packages/open-southeners/laravel-companion-apps"}]
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
